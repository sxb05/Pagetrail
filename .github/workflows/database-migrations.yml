name: Controlled Database Migrations

permissions:
  contents: read

concurrency:
  group: pagetrail-production-migrations
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type APPLY-003 to run the complete project and workspace migration'
        required: true
        type: string

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-migrations

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install migration dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Validate confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = "APPLY-003"

      - name: Read-only migration preflight
        env:
          PYTHONPATH: backend
          ALEMBIC_DATABASE_URL: ${{ secrets.ALEMBIC_DATABASE_URL }}
          EXPECTED_DATABASE_HOST: ${{ vars.EXPECTED_DATABASE_HOST }}
        run: |
          python backend/scripts/verify_migration_target.py

      - name: Apply project operations and workspace migrations
        env:
          PYTHONPATH: backend
          ALEMBIC_DATABASE_URL: ${{ secrets.ALEMBIC_DATABASE_URL }}
        run: |
          alembic -c backend/alembic.ini upgrade 003_personal_organizations

      - name: Verify migration result
        env:
          PYTHONPATH: backend
          ALEMBIC_DATABASE_URL: ${{ secrets.ALEMBIC_DATABASE_URL }}
        run: |
          alembic -c backend/alembic.ini current
          alembic -c backend/alembic.ini check