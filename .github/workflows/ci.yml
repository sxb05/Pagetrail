name: PageTrail CI/CD

on:
  push:
    branches:
      - main
      - fix/render-startup-port-detection
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-and-frontend:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
      PAGETRAIL_GUARDRAILS: "false"
      GOOGLE_CLIENT_ID: "://googleusercontent.com"
      JWT_SECRET_KEY: "test-only-ci-jwt-secret-key-at-least-32-characters"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        run: python -m pytest backend/tests -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Typecheck & build frontend
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          npm ci --prefix frontend
          npx --prefix frontend tsc --project frontend/tsconfig.json --noEmit
          npm run build --prefix frontend


      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_GOOGLE_CLIENT_ID="${{ secrets.VITE_GOOGLE_CLIENT_ID }}" \
            -t pagetrail-ci .

      - name: Verify container binds to a custom port without database credentials
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run -d --rm -p 18081:18081 \
            -e PORT=18081 \
            -e PAGETRAIL_GUARDRAILS=false \
            -e JWT_SECRET_KEY=test-only-ci-jwt-secret-key-at-least-32-characters \
            pagetrail-ci)"
          cleanup() { docker rm -f "$container_id" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:18081/health/live >/dev/null; then
              ready=1
              break
            fi
            if ! docker inspect "$container_id" --format '{{.State.Running}}' | grep -q true; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            docker logs "$container_id"
            echo "Liveness endpoint did not respond on PORT=18081"
            exit 1
          fi

          status="$(curl --silent --output /tmp/ready-response.txt \
            --write-out '%{http_code}' http://127.0.0.1:18081/health/ready)"
          test "$status" = "503"
          echo "Container bound PORT=18081; liveness=200; readiness=$status without DB configuration."
  deploy-to-render:
    name: Deploy to Render
    runs-on: ubuntu-24.04
    needs: [backend-and-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set."
            exit 1
          fi
          curl --silent --show-error --fail "$RENDER_DEPLOY_HOOK_URL"
